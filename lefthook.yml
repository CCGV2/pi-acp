output:
  - failure
  - summary

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    oxlint-fix:
      glob: "*.{ts,mjs,cjs}"
      stage_fixed: true
      run: npx --no-install oxlint --fix --import-plugin {staged_files}
    format:
      stage_fixed: true
      run: |
        output="$(npx --no-install biome check --write {staged_files} 2>&1)"
        status=$?
        printf "%s\n" "$output"
        if [ $status -ne 0 ] && printf "%s" "$output" | grep -q "No files were processed"; then
          exit 0
        fi
        exit $status
    lint:
      run: npm run lint
    lint-types:
      run: npm run typecheck

pre-push:
  parallel: false
  commands:
    lockfile-sync:
      priority: 0
      run: |
        npm install --package-lock-only --ignore-scripts
        if ! git diff --quiet -- package-lock.json; then
          echo ""
          echo "Lockfile is out of sync. Commit the updated lockfile before pushing:"
          echo ""
          git diff --stat -- package-lock.json
          echo ""
          echo "  git add package-lock.json && git commit -m 'chore: sync lockfile'"
          echo ""
          exit 1
        fi
    lint-types:
      priority: 1
      run: npm run typecheck
    lint:
      priority: 2
      run: npm run lint
    test:
      priority: 3
      run: npm test
